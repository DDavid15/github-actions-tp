
name: Commentaire sur PR

on:
  pull_request:
    types: [opened]

permissions:
  contents: read
  pull-requests: write

jobs:
  commentaire:
    runs-on: makebuild

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Publier le README sur la PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file README.md
